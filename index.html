  <style>
    body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    .soon { flex: 1; display: grid; place-items: center; text-align: center; padding: 48px 20px; }
    .soon .word { font-family: var(--display); font-size: clamp(54px, 12vw, 120px); font-weight: 700; letter-spacing: .02em; line-height: 1; }
    .soon .word b { color: var(--gold); }
    .soon h1 { font-family: var(--body); font-size: 12.5px; font-weight: 500; letter-spacing: .38em; text-transform: uppercase; color: var(--ink-2); margin: 22px 0 0; }
    .soon .line { width: 64px; height: 1px; background: var(--gold); margin: 30px auto; opacity: .7; }
    .soon p { color: var(--ink-3); max-width: 420px; margin: 0 auto; font-weight: 300; }
    .soon .dots { display: inline-flex; gap: 6px; margin-top: 26px; }
    .soon .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); opacity: .25; animation: pulse 1.4s infinite ease-in-out; }
    .soon .dots span:nth-child(2) { animation-delay: .2s; }
    .soon .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .soon .dots span { animation: none; opacity: .6; } }
    .foot { display: flex; justify-content: center; padding: 0 20px 36px; }
  </style>
</head>

    </div>
  </main>
  <div class="foot">

      <span class="lbl">Desarrollado por</span>
      <span class="agency"><span class="lg"><img src="assets/img/dgp-mark.png" alt=""></span>DGP Global Group</span>
      <span class="amp">&amp;</span>
      <span class="agency"><span class="lg"><img src="assets/img/moya-mark.png" alt=""></span>Moya Company</span>
    </div>
  </div>
